{% extends "base.html" %}
{% block title %}Dashboard - Oil Mill Management{% endblock %}
{% block content %}
<div class="container-fluid">
    <!-- Camera Lock Option -->
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-end">
            <button class="btn btn-primary">
                <i class="fas fa-lock"></i> Lock Cameras
            </button>
        </div>
    </div>

    <!-- Graphs Section -->
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Machine Usage</h5>
                </div>
                <div class="card-body">
                    <canvas id="graph1" style="height: 300px;"></canvas>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Aggregate People</h5>
                </div>
                <div class="card-body">
                    <canvas id="graph2" style="height: 300px;"></canvas>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Machine Usage Graph (Machine Number vs Hours)
    const ctx1 = document.getElementById('graph1').getContext('2d');
    new Chart(ctx1, {
        type: 'bar',
        data: {
            labels: ['Feeder', 'Crusher 1', 'Crusher 2', 'Crusher 3', 'Crusher 4', 'Filter', 'Filler'],  // Machine names
            datasets: [{
                label: 'Machine Usage (hours)',
                data: [12, 18, 14, 16, 20, 10, 8],  // Hours for each machine
                backgroundColor: 'rgba(54, 162, 235, 0.6)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                },
                tooltip: {
                    enabled: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'No. of Hours'
                    }
                }
            }
        }
    });

    // Aggregrate People Graph (Hourly data)
    const ctx2 = document.getElementById('graph2').getContext('2d');
    new Chart(ctx2, {
        type: 'line',
        data: {
            labels: ['00:00', '01:00', '02:00', '03:00', '04:00', '05:00', '06:00', '07:00', '08:00', '09:00', '10:00', '11:00'],  // Hourly labels
            datasets: [{
                label: 'Aggregrate People',
                data: [300, 500, 400, 700, 600, 450, 800, 950, 1200, 1100, 900, 750],  // Hourly data for people
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderColor: 'rgba(255, 99, 132, 1)',
                borderWidth: 2,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                    position: 'top',
                },
                tooltip: {
                    enabled: true
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    title: {
                        display: true,
                        text: 'No. of People'
                    }
                }
            }
        }
    });
</script>
{% endblock %}
