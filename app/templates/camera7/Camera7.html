{% extends "base.html" %}

{% block title %}Camera 1 Dashboard - Oil Mill Management{% endblock %}

{% block content %}
<div class="container-fluid">
    <!-- Camera Status and Controls -->
    <div class="row mb-4">
        <div class="col-12 d-flex justify-content-between align-items-center">
            <h2>Camera 7 Monitoring</h2>
            <div>
                <span class="badge bg-success me-2">Status: Active</span>
                <button class="btn btn-primary">
                    <i class="fas fa-lock"></i> Lock Camera
                </button>
            </div>
        </div>
    </div>

    <!-- Top Graphs Row -->
    <div class="row mb-4">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Live Feed</h5>
                </div>
                <div class="card-body">
                    <div id="temperatureGraph" style="height: 300px;">
                        <!-- Temperature graph will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Aggregate People</h5>
                </div>
                <div class="card-body">
                    <div id="pressureGraph" style="height: 300px;">
                        <!-- Pressure graph will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Graphs Row -->
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">Machine Usage</h5>
                </div>
                <div class="card-body">
                    <div id="flowRateGraph" style="height: 300px;">
                        <!-- Flow rate graph will be rendered here -->
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h5 class="card-title mb-0">HeatMap</h5>
                </div>
                <div class="card-body">
                    <div id="qualityGraph" style="height: 300px;">
                        <!-- HeatMap will be rendered here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
<script>
// Add JavaScript for rendering the graphs
// Example:
document.addEventListener('DOMContentLoaded', function() {
    // Initialize graphs here using ApexCharts or your preferred charting library
    // Add real-time data updating functionality
});
</script>
{% endblock %}
